name: CI

on: 
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    env:
      build_variant: ${{ matrix.build_variant }}
      targets: ${{ matrix.targets }}
      images_dir: /opt/images
    strategy:
      matrix:
        include:
          - build_variant: "mt7620"
            targets: "PSG1208 PSG1218 NEWIFI-MINI MI-MINI MI-3 OYE-001 5K-W20"
          - build_variant: "mt7628"
            targets: "HC5861B MI-NANO MZ-R13 MZ-R13P 360P2 HC5761A HC5661A"
          - build_variant: "mt7621"
            targets: "K2P_nano K2P DIR-878 RM2100 CR660x"
          - build_variant: "mt7621-usb"
            targets: "XY-C1 JCG-836PRO JCG-AC860M JCG-Y2 DIR-882 A3004NS MSG1500 WR1200JS MI-R3G NEWIFI3 B70"
    steps:
      - uses: actions/checkout@v7

      - name: Prepare output dir
        run: |
          sudo mkdir -p ${images_dir}
          sudo chmod 777 ${images_dir}

      # ubuntu-20.04 runner 已下线，编译在容器内完成
      - name: Build inside Ubuntu 20.04
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v ${images_dir}:${images_dir} \
            -w /src \
            -e targets="${{ env.targets }}" \
            -e images_dir="${{ env.images_dir }}" \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:20.04 \
            bash -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates shellcheck \
                build-essential gcc g++ make cmake \
                libtool-bin libltdl-dev gperf python3-docutils autopoint gettext \
                autoconf automake m4 gawk pkg-config \
                bc bison flex \
                libncurses5-dev zlib1g-dev libssl-dev libelf-dev \
                python3 python3-distutils fakeroot \
                git wget curl unzip file \
                cpio kmod rsync \
                xxd help2man texinfo libgmp3-dev libmpc-dev libmpfr-dev
              sh ./trunk/tools/shellcheck.sh
              cd /src/toolchain-mipsel
              sh dl_toolchain.sh
              cd /src/trunk
              mkdir -p ${images_dir}
              for m in $targets; do
                fakeroot ./build_firmware_ci $m
                if [ $? = 0 ]; then
                  cp -f images/*.trx ${images_dir}/$m.trx
                else
                  exit 1
                fi
                ./clear_tree_simple >/dev/null 2>&1
              done
            '

      - name: Create archive
        if: ${{ github.event_name != 'release' && success() }}
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          ls -lh ${images_dir}
          GIT_VERSION=`git rev-parse --short=7 HEAD 2>/dev/null` && [ -n "$GIT_VERSION" ] && \
          image_name=images_${build_variant}_${GIT_VERSION} || image_name=images_${build_variant}
          cd ${images_dir}; md5sum *.trx | tee md5sum.txt; 7z a -mx=9 ${image_name}.7z ./*
          echo "image_name=${image_name}" >> $GITHUB_ENV

      - name: Upload images to Artifact
        if: ${{ github.event_name != 'release' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.image_name }}
          path: ${{ env.images_dir }}/*.7z

      - name: Upload images to Releases
        if: ${{ github.event_name == 'release' && success() }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.images_dir }}/*.trx
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
